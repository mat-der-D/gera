# Windows 版・macOS 版・Linux 版のビルド。開発機は Linux（Ubuntu 24.04）で、
# Windows と macOS はどちらもクロスコンパイルできない——`windows-latest` と
# `macos-latest` を回すのが唯一の実用的な経路である（docs/DESIGN.md 第 13 節）。
# **Linux 版だけは手元でも作れる**が、渡すときに三 OS 分が同じ下書きリリースに
# 揃っているほうが楽なので、ここでも作る。
#
# 当面の目的は配布ではなく、**実機で試せる人に渡すこと**である
# （IME・フォント・`.md` の関連付け・`user.css` の置き場・`Mod+,` が第 15 節に
# 未検証として並んでいる）。したがって main への push で毎回作り、
# 成果物をアーティファクトとして置く。
#
# **なぜ一つのファイルにまとめてあるか。**Windows と macOS を別ファイルに分けると、
# タグを打ったとき二つの実行が**同じタグの同じ下書きリリースへ**書きに行く。
# softprops/action-gh-release v3 は下書きを見つけて一つにまとめてくれるが、
# `body` は**あとから書いた側が前の側を上書きする**（v3 のソースで確認。
# `append_body` を使わない限り update は body を置き換える）。
# つまり分けると、**Gatekeeper の回避手順か SmartScreen の回避手順のどちらかが、
# 実行の順番次第で消える。**受け取る側がアプリを開けなくなる種類の欠落なので、
# リリース本文を書く場所は一つに保つ。
#
# ビルドは OS ごとに独立したジョブなので、**片方が落ちてももう片方の成果物は出る**
# （アーティファクトはジョブごとに上がる）。**リリースの下書きだけは両方の成功を要求する**
# ——タグを打って配る成果物が片肺なのは、下書きとしても望ましくない。
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同じブランチで走っている古い実行は打ち切る。待たされないことが目的なので、
# 追い越された実行に runner を使わせない。ただしタグの実行は打ち切らない。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # 版は開発機に合わせて固定してある（node 23.8.0 / npm 10.9.2、rustc 1.97.0）。
      # 手元で通ったものと同じ道具で組むためで、上げるときは macOS 側と揃えて直す。
      - uses: actions/setup-node@v7
        with:
          node-version: '23.8.0'
          cache: npm

      - name: Install Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      # Rust のビルドは遅い。src-tauri/target を跨いで持ち回す。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version

      - run: npm ci

      # 作るものは tauri.conf.json の targets が決める。deb も入っているが、
      # Tauri が OS に合わないものを自分で外すので Windows では nsis と msi になる。
      #
      # **--bundles で明示しないこと。**Windows の cmd.exe はカンマを引数の
      # 区切りとして扱うため、`--bundles nsis,msi` が `'nsis msi'` に化けて
      # cargo build まで流れ、`unexpected argument` で落ちた（2026-09-04 の実測）。
      # 設定が変わって成果物が消えた場合は、下の if-no-files-found: error が捕まえる。
      - name: Build (nsis + msi)
        run: npm run tauri -- build

      # インストーラ。`.md` の関連付けとショートカットはこちらでしか登録されない。
      - uses: actions/upload-artifact@v7
        with:
          name: gera-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # 素の実行ファイル。入れずに起動速度だけ見たいときのため。
      - uses: actions/upload-artifact@v7
        with:
          name: gera-windows-exe
          path: src-tauri/target/release/gera.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # 版は Windows 側と同じものに固定する（上のコメント参照）。
      - uses: actions/setup-node@v7
        with:
          node-version: '23.8.0'
          cache: npm

      # **両方のターゲットを入れる。**`universal-apple-darwin` は疑似ターゲットで、
      # 実体は aarch64 と x86_64 を別々に組んで `lipo` で束ねたものである。
      # 片方しか入っていないとビルドが落ちる。`rustup target add` は
      # default に設定したツールチェーンに対して効くので、順番を入れ替えないこと。
      - name: Install Rust 1.97.0 (both Apple targets)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version
          rustup target list --installed

      - run: npm ci

      # **ここでは --bundles を明示する必要がある。**tauri.conf.json の targets は
      # ["deb", "nsis", "msi"] であって macOS 用のものが一つも無い。Tauri は
      # OS に合わないものを外すので、そのままだと macOS では作るものが残らない。
      #
      # カンマ区切りは macOS の shell（bash）では化けない——Windows で
      # `--bundles nsis,msi` が壊れたのは cmd.exe の引数解釈が原因であって、
      # Tauri の CLI 自体は "Space or comma separated list" を受け付ける
      # （`tauri build --help` の記載）。
      #
      # 友人の Mac が Apple Silicon か Intel か分かっていないので
      # **ユニバーサルバイナリにする。**片方だけだと外したときに起動すらしない。
      - name: Build universal (app + dmg)
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

      # --target を付けると成果物は target/<target>/release/ の下に移る。
      # 落ちたときに何がどこにあるか分かるよう、中身を出しておく。
      - name: List bundle output
        run: ls -lR src-tauri/target/universal-apple-darwin/release/bundle

      # **.app は自分で zip する。**GitHub のアーティファクトは実行権限を保存しない
      # ため、`.app`（ディレクトリ）をそのまま上げると、落として展開したものは
      # 実行ビットもシンボリックリンクも失って起動しない。`ditto -c -k` は
      # 実行権限・シンボリックリンク・拡張属性を保つ macOS 標準の経路である。
      - name: Zip the .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/gera.app \
            gera-macos-universal.app.zip

      # ディスクイメージ。/Applications に入れて使うとき用。
      - uses: actions/upload-artifact@v7
        with:
          name: gera-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # 素のアプリ。入れずに動かしたいとき用（Windows 側の gera.exe と同じ考え方）。
      - uses: actions/upload-artifact@v7
        with:
          name: gera-macos-app
          path: gera-macos-universal.app.zip
          if-no-files-found: error

  # Linux 版。**開発機が Linux なので、ここでしか作れないものは何も無い。**
  # それでも Actions で作る理由は二つある——タグを打ったとき三 OS 分が揃って
  # 同じ下書きリリースに載ること、それと手元の環境に依存しない再現性である。
  linux:
    # **`ubuntu-latest` にしない。**Linux のバイナリは、**組んだ機械の glibc より
    # 古い環境では起動しない。**`ubuntu-latest` が指す先が上がると、渡せる相手が
    # 黙って減る。固定して、上げるときは意識して上げる。
    #
    # **24.04 の glibc は 2.39 である。**つまりこの成果物が動くのは
    # **Ubuntu 24.04 以降・Debian 13 以降**で、Ubuntu 22.04 では動かない。
    # 22.04 の runner を使えばそちらに合わせられるが、**その image は
    # 2026-09-17 に非推奨化が始まり（ジョブが意図的に落とされる期間がある）、
    # 2027-04-17 に完全に消える**ので、新規に選ぶ先ではない。
    # もっと古い環境に配る必要が出たら、runner ではなく
    # `container: ubuntu:22.04` を使う（container の寿命は runner image とは別）。
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # WebKitGTK 4.1 は runner に入っていない。Tauri v2 の Linux ビルドは
      # これに対して組む（4.0 ではない）。patchelf は AppImage の側で要る。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential file

      # 版は Windows・macOS 側と同じものに固定する（上のコメント参照）。
      - uses: actions/setup-node@v7
        with:
          node-version: '23.8.0'
          cache: npm

      - name: Install Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version
          ldd --version | head -1

      - run: npm ci

      # **`--bundles` を明示する。**tauri.conf.json の targets に appimage が
      # 無いので、既定では deb しか出ない。カンマ区切りは bash では化けない
      # （化けたのは Windows の cmd.exe である。macOS のジョブのコメント参照）。
      #
      # **二つ作るのは、届く範囲が違うからである。**deb は Ubuntu/Debian 系専用だが、
      # `.md` の関連付けとメニュー登録をしてくれるのはこちらだけである。
      # AppImage は入れずに単体で動き、ディストリを選ばない——ただし
      # **glibc の下限からは逃げられない**（WebKitGTK は同梱するが libc はしない）。
      - name: Build (deb + AppImage)
        run: npm run tauri -- build --bundles deb,appimage

      # **AppImage だけ後始末が要る。**deb は `Depends:` を書くだけで
      # 共有ライブラリを一つも再配布しないが、**AppImage は同梱する。**
      # 同梱したものの条件が、そのまま gera の配布条件になる。
      #
      # ここで三つやる。**(a)** 使ってもいない経路からぶら下がってくる GPL の
      # ライブラリ（libjbig・libltdl）を落とす、**(b)** 残った 120 個ぶんの
      # 条件を全文で書き出す（LGPL は全文と入手先の提示が要る）、
      # **(c)** AppDir を詰め直す。
      #
      # **同梱されるパッケージが増えたら、この工程が落ちる。**条件を
      # 確かめないまま配ることを防ぐための関門で、記録は
      # .github/scripts/appimage-bundled-packages.txt にある。
      - name: Trim GPL libraries and write licence notices (AppImage)
        run: ./.github/scripts/appimage-postprocess.sh

      - name: List bundle output
        run: ls -lR src-tauri/target/release/bundle

      - uses: actions/upload-artifact@v7
        with:
          name: gera-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # **AppImage は実行ビットが落ちる。**アーティファクトも Release の資産も
      # パーミッションを保存しないため、受け取った側は必ず `chmod +x` が要る。
      # リリース本文にその一行を書いてある。
      - uses: actions/upload-artifact@v7
        with:
          name: gera-linux-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/THIRD-PARTY-LICENSES-linux.txt
          if-no-files-found: error

  # タグ（v*）のときだけ Releases に置く。**下書きのまま置く**——
  # 中身を本人が確かめてから公開する（勝手に公開しない）。
  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -lR artifacts

      # 名前は upload-artifact のときのものと同じ。ただし複数のパスを
      # 一つのアーティファクトに入れると、共通の親から下のディレクトリ構造が
      # そのまま残る（gera-windows-installer は nsis/ と msi/ を含む）ので、
      # ここでは `**` で受ける。取りこぼしは fail_on_unmatched_files が捕まえる。
      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/gera-windows-installer/**/*-setup.exe
            artifacts/gera-windows-installer/**/*.msi
            artifacts/gera-windows-exe/gera.exe
            artifacts/gera-macos-dmg/*.dmg
            artifacts/gera-macos-app/gera-macos-universal.app.zip
            artifacts/gera-linux-deb/*.deb
            artifacts/gera-linux-appimage/*.AppImage
            artifacts/gera-linux-appimage/THIRD-PARTY-LICENSES-linux.txt
          body: |
            ## Windows 版

            - `gera_*-setup.exe` — インストーラ（NSIS）。`.md` の関連付けとショートカットはこちらで登録される
            - `gera_*.msi` — 同じものの MSI 版
            - `gera.exe` — 素の実行ファイル。入れずに動かしたいとき用（関連付けは付かない）

            **このバイナリは署名していない。**そのため Windows SmartScreen が
            「WindowsによってPCが保護されました」と警告を出す。
            **「詳細情報」→「実行」**で進められる。

            ## macOS 版

            **ユニバーサルバイナリである**（Apple Silicon と Intel の両方で動く）。

            - `gera_*_universal.dmg` — ディスクイメージ。開いて `gera.app` を「アプリケーション」へ入れる
            - `gera-macos-universal.app.zip` — 素のアプリ。入れずに動かしたいとき用

            **このバイナリは署名も公証（notarization）もしていない。**そのため
            初回は Gatekeeper が止め、ダブルクリックでは開けない。**壊れているのではない。**

            1. まず一度、普通に開こうとする（止められる）
            2. **システム設定 → プライバシーとセキュリティ**を開き、下へスクロールして
               **「このまま開く」**を押す
            3. もう一度警告が出るので**「開く」**を押す

            以降は普通に開ける。

            **右クリック →「開く」は、macOS 15 (Sequoia) 以降では通らない**——
            Apple がこの抜け道を塞いだため、現行の手順は上の「このまま開く」である。
            古い macOS では右クリックでも開ける。

            端末から外す場合は `xattr -d com.apple.quarantine /Applications/gera.app`
            （**未検証**）。

            **macOS 版はまだ誰も実機で動かしていない。**確かめるべき項目は
            README の「macOS で確かめること」と docs/DESIGN.md 第 15 節にある。

            ## Linux 版

            **Ubuntu 24.04 以降（glibc 2.39 以降）が要る。**22.04 では起動しない。

            - `gera_*_amd64.deb` — Ubuntu/Debian 系向け。`sudo apt install ./gera_*_amd64.deb` で入る。**`.md` の関連付けとメニュー登録が付くのはこちら**
            - `gera_*_amd64.AppImage` — 入れずに単体で動く。ディストリを選ばない。**落としたあと `chmod +x` が要る**（Release の資産は実行権限を保存しない）
            - `THIRD-PARTY-LICENSES-linux.txt` — AppImage が同梱しているライブラリの利用条件。**AppImage は WebKitGTK・GTK3・glib・cairo・pango・libsoup を同梱していて、これらは LGPL である**ため、全文とソースの入手先を添えてある。同じものが AppImage の中の `usr/share/doc/gera/` にも入っている。deb はライブラリを同梱せずディストリのものを使うので、こちらには付かない

            x86_64 のみである（ARM 版は作っていない）。
