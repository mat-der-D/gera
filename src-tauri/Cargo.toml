[package]
name = "gera"
version = "0.1.0"
description = "gera — Markdown editor for proofreading AI output"
edition = "2021"
rust-version = "1.77.2"

# edition 2024 にしない。2024 では `std::env::set_var` が unsafe fn になり、
# 起動時の IME 設定（lib.rs の setup_ime_env）を unsafe ブロックで囲む必要が出る。
# GTK 初期化前・単一スレッドでの設定は実際には安全なので、
# unsafe を書かずに済む 2021 に留める。

[lib]
# Windows で実行ファイル名 `gera` とライブラリ名が衝突するのを避けるため、
# Tauri 2 の慣例に従って lib 側だけ別名にする。
name = "gera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
