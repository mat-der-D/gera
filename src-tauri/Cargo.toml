[package]
name = "gera"
version = "0.1.0"
description = "gera — Markdown editor for proofreading AI output"
edition = "2021"
rust-version = "1.77.2"

# Do not move to edition 2024. There `std::env::set_var` becomes an unsafe fn,
# which would force the IME setup at startup (setup_ime_env in lib.rs) into an
# unsafe block. Setting it before GTK initialisation, on a single thread, is
# actually safe, so we stay on 2021 and avoid writing unsafe at all.

[lib]
# To avoid a clash between the executable name `gera` and the library name on
# Windows, only the lib gets a different name, following the Tauri 2 convention.
name = "gera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# A bare `cargo build --release` does NOT produce a release build. Without this
# feature enabled, tauri treats the build as dev: it does not embed frontendDist
# and instead goes looking at devUrl (localhost:5173) — measured, the artifact of
# a bare build showed nothing but a "Could not connect to localhost" screen.
# `tauri build` enables the feature itself and so is unaffected, but any route
# that drives cargo directly (measurement runs, for instance) has no way to stand
# the app up without this declaration.
# It ships in the Tauri template from the start.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# For handing http/https links to the OS default browser (see DESIGN.md §7-4 (d),
# §9-1). Only the Rust side calls it — putting the scheme check in the front end
# means it is bypassed entirely the moment the webview is compromised.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"

# Startup speed is the top priority (see DESIGN.md §4), and most of the
# difference in cold start comes from how much binary has to be loaded (§5-1).
# So the release profile is built to cut size. The Rust side only reads files at
# startup and shuttles IPC around; the heavy computation lives inside WebKitGTK,
# so lowering opt-level does not affect running speed.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
