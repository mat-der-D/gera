[package]
name = "gera"
version = "0.1.0"
description = "gera — Markdown editor for proofreading AI output"
edition = "2021"
rust-version = "1.77.2"

# edition 2024 にしない。2024 では `std::env::set_var` が unsafe fn になり、
# 起動時の IME 設定（lib.rs の setup_ime_env）を unsafe ブロックで囲む必要が出る。
# GTK 初期化前・単一スレッドでの設定は実際には安全なので、
# unsafe を書かずに済む 2021 に留める。

[lib]
# Windows で実行ファイル名 `gera` とライブラリ名が衝突するのを避けるため、
# Tauri 2 の慣例に従って lib 側だけ別名にする。
name = "gera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# **素の `cargo build --release` はリリース版にならない。**この feature が
# 立っていないと tauri は dev 扱いになり、frontendDist を埋め込まず
# devUrl（localhost:5173）を見に行く——実測で、素のビルドの成果物は
# 「Could not connect to localhost」の画面しか出さなかった。
# `tauri build` は自分で有効化するので影響を受けないが、
# cargo を直接叩く経路（測定など）はこの宣言が無いと立てようがない。
# Tauri のテンプレートには最初から入っている。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"

# 起動速度が第一優先（設計 第 4 節）で、コールド起動の差の大半は
# バイナリの読み込み量に由来する（第 5-1 節）。したがって release は
# サイズを削る方向で組む。Rust 側は起動時のファイル読みと IPC の
# 取り回しだけで、重い計算は WebKitGTK の中にあるため、
# opt-level を落としても動作速度には効かない。
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
